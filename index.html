<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Password</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <h1>Password Generator</h1>
        <div class="main">
            <div class="inputGen">
                <input type="text" name="" id="passPlace" value = "" placeholder="Click Generate">
                <button id = "generatePass">Generate</button>
            </div>
            <div class="last">
            <span><input id = "isCapital" type="checkbox" name=""  value="capital" checked = "true" > <span>Capital</span> </span>
            <span><input id = "isSmall" type="checkbox"  name=""    value="small" checked = "true"> <span>Small</span> </span>
            <span><input id = "isNumber" type="checkbox" name=""   value="number" checked = "true"> <span>Number</span> </span>
            <span><input id = "isSymbol" type="checkbox" name=""   value="symbol"  checked = "true"> <span>Symbol</span> </span>
            <input id = "length" type="range" name="" id="" value="4" min="4" max="16">
            <p id="lengthValue">Length of password = 4</p>
            </div>

        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
